<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — not found</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0f12; color: #e6e6e6; }
      a { color: #9ec3ff; }
    }
    main { text-align: center; max-width: 480px; }
    h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; }
    p { margin: 8px 0 24px; color: inherit; opacity: 0.75; }
    a { color: #1a4fff; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page isn't here.</p>
    <p><a href="/">← back to index</a></p>
  </main>
</body>
</html>
